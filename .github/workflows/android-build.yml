name: Android Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          ls -la app/build/outputs/apk/debug/

      - name: Zipalign and sign APK
        working-directory: android
        run: |
          # Find SDK build-tools
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"
          
          # Zipalign
          "$BUILD_TOOLS/zipalign" -f -v 4 app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug-signed.apk
          
          # Generate debug keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          
          # Sign with apksigner
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android app/build/outputs/apk/debug/app-debug-signed.apk
          
          # Verify
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug-signed.apk
          
          echo "Signed APK:"
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taxsense-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug-signed.apk
          retention-days: 30
